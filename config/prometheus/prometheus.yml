global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert-rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'logistics-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['logistics-service:8080']

  - job_name: 'logistics-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['logistics-gateway:8888']

  - job_name: 'spark-master'
    static_configs:
      - targets: ['spark-master:8081']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['es-exporter:9114']

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
