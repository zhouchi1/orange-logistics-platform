name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/orange-logistics
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.12'

jobs:
  # ==================== Build & Test ====================
  build-java:
    name: Build Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Maven Build
        run: mvn clean package -DskipTests -B -q

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: java-artifacts
          path: '**/target/*.jar'
          retention-days: 1

  test-java:
    name: Java Unit Tests
    runs-on: ubuntu-latest
    needs: build-java
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Tests
        run: mvn test -B -pl '!orange-logistics-streaming'

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: '**/target/surefire-reports/TEST-*.xml'

      - name: Test Report
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: Java Tests
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit

  test-python:
    name: Python Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            orange-logistics-ai-prediction/requirements-docker.txt
            orange-logistics-ai-agent/requirements-docker.txt

      - name: Validate AI Prediction
        run: |
          cd orange-logistics-ai-prediction
          pip install -r requirements-docker.txt -q
          python -c "from app.config import settings; from app.api.arrival_routes import arrival_router; print('✓ ai-prediction OK')"

      - name: Validate AI Agent
        run: |
          cd orange-logistics-ai-agent
          pip install -r requirements-docker.txt -q
          python -c "from app.config import settings; from fastapi import FastAPI; print('✓ ai-agent OK')"

  # ==================== Docker Build & Push ====================
  docker-build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-java, test-python]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - module: gateway
            context: ./orange-logistics-gateway
          - module: service
            context: ./orange-logistics-service
          - module: monitor
            context: ./orange-logistics-monitor
          - module: transport
            context: ./orange-logistics-transport
          - module: dispatch
            context: ./orange-logistics-dispatch
          - module: billing
            context: ./orange-logistics-billing
          - module: customer
            context: ./orange-logistics-customer
          - module: notification
            context: ./orange-logistics-notification
          - module: report
            context: ./orange-logistics-report
          - module: risk
            context: ./orange-logistics-risk
          - module: scheduler
            context: ./orange-logistics-scheduler
          - module: search
            context: ./orange-logistics-search
          - module: config
            context: ./orange-logistics-config
          - module: im
            context: ./orange-logistics-im
          - module: auth
            context: ./orange-logistics-auth
          - module: order
            context: ./orange-logistics-order
          - module: waybill
            context: ./orange-logistics-waybill
          - module: warehouse
            context: ./orange-logistics-warehouse
          - module: ai-prediction
            context: ./orange-logistics-ai-prediction
          - module: ai-agent
            context: ./orange-logistics-ai-agent
    steps:
      - uses: actions/checkout@v4

      - name: Download Java Artifacts
        if: ${{ !startsWith(matrix.module, 'ai-') }}
        uses: actions/download-artifact@v4
        with:
          name: java-artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.module }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Deploy Dev ====================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev-api.orange-logistics.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          helm upgrade --install orange-logistics ./deploy/helm/orange-logistics \
            --namespace orange-logistics-dev \
            --create-namespace \
            --set global.imageTag=${IMAGE_TAG} \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ github.repository_owner }} \
            -f ./deploy/helm/orange-logistics/values.yaml \
            -f ./deploy/k8s/overlays/dev/values-dev.yaml \
            --wait --timeout 10m

      - name: Deploy AI Services
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          kubectl set image deployment/ai-prediction \
            ai-prediction=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-prediction:${IMAGE_TAG} \
            -n orange-logistics-dev
          kubectl set image deployment/ai-agent \
            ai-agent=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-agent:${IMAGE_TAG} \
            -n orange-logistics-dev
          kubectl rollout status deployment --all -n orange-logistics-dev --timeout=300s

      - name: Notify Success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.WECHAT_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{"msgtype":"markdown","markdown":{"content":"## ✅ Dev 部署成功\n> 分支: ${{ github.ref_name }}\n> 版本: '"${GITHUB_SHA::7}"'\n> 提交: ${{ github.event.head_commit.message }}\n> 触发: ${{ github.actor }}"}}'

  # ==================== Deploy Staging ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/heads/release/')
    environment:
      name: staging
      url: https://staging-api.orange-logistics.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          helm upgrade --install orange-logistics ./deploy/helm/orange-logistics \
            --namespace orange-logistics-staging \
            --create-namespace \
            --set global.imageTag=${IMAGE_TAG} \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ github.repository_owner }} \
            -f ./deploy/helm/orange-logistics/values.yaml \
            --wait --timeout 10m

      - name: Notify
        if: always()
        run: |
          STATUS=${{ job.status == 'success' && '✅' || '❌' }}
          curl -s -X POST "${{ secrets.WECHAT_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{"msgtype":"markdown","markdown":{"content":"## '"${STATUS}"' Staging 部署 ${{ job.status }}\n> 版本: '"${GITHUB_SHA::7}"'\n> 分支: ${{ github.ref_name }}"}}'

  # ==================== Deploy Production ====================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.orange-logistics.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          helm upgrade --install orange-logistics ./deploy/helm/orange-logistics \
            --namespace orange-logistics \
            --set global.imageTag=${IMAGE_TAG} \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ github.repository_owner }} \
            -f ./deploy/helm/orange-logistics/values.yaml \
            -f ./deploy/k8s/overlays/prod/values-prod.yaml \
            --wait --timeout 15m

      - name: Deploy AI Services
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          kubectl set image deployment/ai-prediction \
            ai-prediction=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-prediction:${IMAGE_TAG} \
            -n orange-logistics
          kubectl set image deployment/ai-agent \
            ai-agent=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-agent:${IMAGE_TAG} \
            -n orange-logistics
          kubectl rollout status deployment --all -n orange-logistics --timeout=300s

      - name: Notify
        if: always()
        run: |
          STATUS=${{ job.status == 'success' && '🚀' || '❌' }}
          curl -s -X POST "${{ secrets.WECHAT_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{"msgtype":"markdown","markdown":{"content":"## '"${STATUS}"' 生产部署 ${{ job.status }}\n> 版本: '"${GITHUB_SHA::7}"'\n> 提交: ${{ github.event.head_commit.message }}\n> 操作人: ${{ github.actor }}"}}'
