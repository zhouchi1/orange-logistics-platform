stages:
  - build
  - test
  - quality
  - docker
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  REGISTRY: "${CI_REGISTRY}"
  REGISTRY_IMAGE: "${CI_REGISTRY_IMAGE}"
  HELM_RELEASE: "orange-logistics"
  NAMESPACE: "orange-logistics"
  IMAGE_TAG: "${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/
    - .pip-cache/

# ==================== Build Stage ====================
build-java:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests -B -q
  artifacts:
    paths:
      - "**/target/*.jar"
    expire_in: 1 hour
  tags:
    - docker

build-python:
  stage: build
  image: python:3.12-slim
  script:
    - pip install --cache-dir=.pip-cache -r orange-logistics-ai-prediction/requirements-docker.txt
    - pip install --cache-dir=.pip-cache -r orange-logistics-ai-agent/requirements-docker.txt
    - echo "Python dependencies verified"
  tags:
    - docker

# ==================== Test Stage ====================
unit-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn test -B -pl '!orange-logistics-streaming'
  artifacts:
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
    when: always
  tags:
    - docker

python-test:
  stage: test
  image: python:3.12-slim
  script:
    - cd orange-logistics-ai-prediction
    - pip install -r requirements-docker.txt -q
    - python -c "from app.main import app; print('ai-prediction import OK')"
    - cd ../orange-logistics-ai-agent
    - pip install -r requirements-docker.txt -q
    - python -c "from app.main import app; print('ai-agent import OK')"
  tags:
    - docker

# ==================== Code Quality ====================
sonarqube:
  stage: quality
  image: maven:3.9-eclipse-temurin-17
  script:
    - >
      mvn sonar:sonar
      -Dsonar.host.url=${SONAR_URL}
      -Dsonar.token=${SONAR_TOKEN}
      -Dsonar.projectKey=orange-logistics-platform
      -B
  only:
    - develop
    - main
  allow_failure: true
  tags:
    - docker

# ==================== Docker Build & Push ====================
docker-java:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      MODULES="gateway service monitor transport dispatch billing customer notification report risk scheduler search config im auth order waybill warehouse"
      for module in $MODULES; do
        echo "=== Building orange-logistics-${module} ==="
        docker build \
          -t ${REGISTRY_IMAGE}/${module}:${IMAGE_TAG} \
          -t ${REGISTRY_IMAGE}/${module}:latest \
          ./orange-logistics-${module}
        docker push ${REGISTRY_IMAGE}/${module}:${IMAGE_TAG}
        docker push ${REGISTRY_IMAGE}/${module}:latest
      done
  after_script:
    - docker logout $CI_REGISTRY
  only:
    - develop
    - main
    - /^release\/.*$/
  tags:
    - docker

docker-ai:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      # AI Prediction
      docker build \
        -t ${REGISTRY_IMAGE}/ai-prediction:${IMAGE_TAG} \
        -t ${REGISTRY_IMAGE}/ai-prediction:latest \
        ./orange-logistics-ai-prediction
      docker push ${REGISTRY_IMAGE}/ai-prediction:${IMAGE_TAG}
      docker push ${REGISTRY_IMAGE}/ai-prediction:latest

      # AI Agent
      docker build \
        -t ${REGISTRY_IMAGE}/ai-agent:${IMAGE_TAG} \
        -t ${REGISTRY_IMAGE}/ai-agent:latest \
        ./orange-logistics-ai-agent
      docker push ${REGISTRY_IMAGE}/ai-agent:${IMAGE_TAG}
      docker push ${REGISTRY_IMAGE}/ai-agent:latest
  after_script:
    - docker logout $CI_REGISTRY
  only:
    - develop
    - main
    - /^release\/.*$/
  tags:
    - docker

# ==================== Deploy Dev ====================
deploy-dev:
  stage: deploy-dev
  image: bitnami/kubectl:1.32
  script:
    - |
      echo "Deploying to local K8s..."
      MODULES="gateway service monitor transport dispatch billing customer notification report risk scheduler search config im auth order waybill warehouse"
      for module in $MODULES; do
        kubectl set image deployment/logistics-${module} \
          logistics-${module}=${REGISTRY_IMAGE}/${module}:${IMAGE_TAG} \
          -n ${NAMESPACE} || true
      done
      kubectl set image deployment/ai-prediction \
        ai-prediction=${REGISTRY_IMAGE}/ai-prediction:${IMAGE_TAG} \
        -n ${NAMESPACE} || true
      kubectl set image deployment/ai-agent \
        ai-agent=${REGISTRY_IMAGE}/ai-agent:${IMAGE_TAG} \
        -n ${NAMESPACE} || true
      kubectl rollout status deployment --all -n ${NAMESPACE} --timeout=300s
  environment:
    name: development
  only:
    - develop
  tags:
    - docker

# ==================== Deploy Staging ====================
deploy-staging:
  stage: deploy-staging
  image: bitnami/kubectl:1.32
  script:
    - |
      echo "Deploying to staging namespace..."
      kubectl rollout restart deployment --all -n ${NAMESPACE}
      kubectl rollout status deployment --all -n ${NAMESPACE} --timeout=300s
  environment:
    name: staging
  only:
    - /^release\/.*$/
  tags:
    - docker

# ==================== Deploy Production ====================
deploy-prod:
  stage: deploy-prod
  image: bitnami/kubectl:1.32
  script:
    - |
      echo "Production deploy - version: ${IMAGE_TAG}"
      kubectl rollout restart deployment --all -n ${NAMESPACE}
      kubectl rollout status deployment --all -n ${NAMESPACE} --timeout=300s
      echo "Deploy complete!"
  environment:
    name: production
  when: manual
  only:
    - main
  tags:
    - docker

# ==================== Rollback ====================
rollback-prod:
  stage: deploy-prod
  image: bitnami/kubectl:1.32
  script:
    - |
      echo "Rolling back all deployments..."
      DEPLOYMENTS=$(kubectl get deployment -n ${NAMESPACE} -o name)
      for dep in $DEPLOYMENTS; do
        kubectl rollout undo $dep -n ${NAMESPACE}
      done
      kubectl rollout status deployment --all -n ${NAMESPACE} --timeout=300s
  environment:
    name: production
  when: manual
  only:
    - main
  tags:
    - docker
