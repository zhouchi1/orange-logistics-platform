stages:
  - build
  - test
  - quality
  - docker
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  HARBOR_REGISTRY: "harbor.orange-logistics.com"
  HELM_RELEASE: "orange-logistics"
  NAMESPACE: "orange-logistics"
  IMAGE_TAG: "${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
  # Python AI services
  AI_PREDICTION_IMAGE: "${HARBOR_REGISTRY}/orange-logistics-ai-prediction"
  AI_AGENT_IMAGE: "${HARBOR_REGISTRY}/orange-logistics-ai-agent"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/
    - .pip-cache/

# ==================== Build Stage ====================
build-java:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests -B -q
  artifacts:
    paths:
      - "**/target/*.jar"
    expire_in: 1 hour
  tags:
    - docker

build-python:
  stage: build
  image: python:3.12-slim
  script:
    - pip install --cache-dir=.pip-cache -r orange-logistics-ai-prediction/requirements-docker.txt
    - pip install --cache-dir=.pip-cache -r orange-logistics-ai-agent/requirements-docker.txt
    - echo "Python dependencies verified"
  tags:
    - docker

# ==================== Test Stage ====================
unit-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn test -B -pl '!orange-logistics-streaming'
  artifacts:
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
    when: always
  tags:
    - docker

python-test:
  stage: test
  image: python:3.12-slim
  script:
    - cd orange-logistics-ai-prediction
    - pip install -r requirements-docker.txt -q
    - python -c "from app.main import app; print('ai-prediction import OK')"
    - cd ../orange-logistics-ai-agent
    - pip install -r requirements-docker.txt -q
    - python -c "from app.main import app; print('ai-agent import OK')"
  tags:
    - docker

# ==================== Code Quality ====================
sonarqube:
  stage: quality
  image: maven:3.9-eclipse-temurin-17
  script:
    - >
      mvn sonar:sonar
      -Dsonar.host.url=${SONAR_URL}
      -Dsonar.token=${SONAR_TOKEN}
      -Dsonar.projectKey=orange-logistics-platform
      -B
  only:
    - develop
    - main
  allow_failure: true
  tags:
    - docker

# ==================== Docker Build & Push ====================
docker-java:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login $HARBOR_REGISTRY -u "$HARBOR_USERNAME" --password-stdin
  script:
    - |
      MODULES="gateway service monitor transport dispatch billing customer notification report risk scheduler search config im auth order waybill warehouse"
      for module in $MODULES; do
        echo "=== Building orange-logistics-${module} ==="
        docker build \
          --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --build-arg GIT_COMMIT=${CI_COMMIT_SHORT_SHA} \
          --build-arg VERSION=${IMAGE_TAG} \
          -t ${HARBOR_REGISTRY}/orange-logistics-${module}:${IMAGE_TAG} \
          -t ${HARBOR_REGISTRY}/orange-logistics-${module}:latest \
          ./orange-logistics-${module}
        docker push ${HARBOR_REGISTRY}/orange-logistics-${module}:${IMAGE_TAG}
        docker push ${HARBOR_REGISTRY}/orange-logistics-${module}:latest
      done
  after_script:
    - docker logout $HARBOR_REGISTRY
  only:
    - develop
    - main
    - /^release\/.*$/
  tags:
    - docker

docker-ai:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login $HARBOR_REGISTRY -u "$HARBOR_USERNAME" --password-stdin
  script:
    - |
      # AI Prediction
      docker build \
        -t ${AI_PREDICTION_IMAGE}:${IMAGE_TAG} \
        -t ${AI_PREDICTION_IMAGE}:latest \
        ./orange-logistics-ai-prediction
      docker push ${AI_PREDICTION_IMAGE}:${IMAGE_TAG}
      docker push ${AI_PREDICTION_IMAGE}:latest

      # AI Agent
      docker build \
        -t ${AI_AGENT_IMAGE}:${IMAGE_TAG} \
        -t ${AI_AGENT_IMAGE}:latest \
        ./orange-logistics-ai-agent
      docker push ${AI_AGENT_IMAGE}:${IMAGE_TAG}
      docker push ${AI_AGENT_IMAGE}:latest
  after_script:
    - docker logout $HARBOR_REGISTRY
  only:
    - develop
    - main
    - /^release\/.*$/
  tags:
    - docker

# ==================== Deploy Dev ====================
deploy-dev:
  stage: deploy-dev
  image: alpine/helm:3.14
  before_script:
    - apk add --no-cache curl
    - kubectl version --client || true
  script:
    - |
      helm upgrade --install ${HELM_RELEASE} ./deploy/helm/orange-logistics \
        --namespace ${NAMESPACE}-dev \
        --create-namespace \
        --set global.imageTag=${IMAGE_TAG} \
        --set global.imageRegistry=${HARBOR_REGISTRY} \
        -f ./deploy/helm/orange-logistics/values.yaml \
        -f ./deploy/k8s/overlays/dev/values-dev.yaml \
        --wait --timeout 10m
    - |
      echo "Deploying AI services to dev..."
      kubectl set image deployment/ai-prediction \
        ai-prediction=${AI_PREDICTION_IMAGE}:${IMAGE_TAG} \
        -n ${NAMESPACE}-dev
      kubectl set image deployment/ai-agent \
        ai-agent=${AI_AGENT_IMAGE}:${IMAGE_TAG} \
        -n ${NAMESPACE}-dev
      kubectl rollout status deployment/ai-prediction -n ${NAMESPACE}-dev --timeout=120s
      kubectl rollout status deployment/ai-agent -n ${NAMESPACE}-dev --timeout=120s
  after_script:
    - |
      # 通知企业微信
      curl -s -X POST "${WECHAT_WEBHOOK}" \
        -H 'Content-Type: application/json' \
        -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## ✅ Dev 部署成功\n> 分支: ${CI_COMMIT_REF_NAME}\n> 版本: ${IMAGE_TAG}\n> 提交: ${CI_COMMIT_MESSAGE}\n> 触发: ${GITLAB_USER_NAME}\"}}"
  environment:
    name: development
    url: https://dev-api.orange-logistics.com
  only:
    - develop
  tags:
    - k8s

# ==================== Deploy Staging ====================
deploy-staging:
  stage: deploy-staging
  image: alpine/helm:3.14
  script:
    - |
      helm upgrade --install ${HELM_RELEASE} ./deploy/helm/orange-logistics \
        --namespace ${NAMESPACE}-staging \
        --create-namespace \
        --set global.imageTag=${IMAGE_TAG} \
        --set global.imageRegistry=${HARBOR_REGISTRY} \
        -f ./deploy/helm/orange-logistics/values.yaml \
        --wait --timeout 10m
    - |
      kubectl set image deployment/ai-prediction \
        ai-prediction=${AI_PREDICTION_IMAGE}:${IMAGE_TAG} \
        -n ${NAMESPACE}-staging
      kubectl set image deployment/ai-agent \
        ai-agent=${AI_AGENT_IMAGE}:${IMAGE_TAG} \
        -n ${NAMESPACE}-staging
  after_script:
    - |
      curl -s -X POST "${WECHAT_WEBHOOK}" \
        -H 'Content-Type: application/json' \
        -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## 🟡 Staging 部署成功\n> 版本: ${IMAGE_TAG}\n> 分支: ${CI_COMMIT_REF_NAME}\"}}"
  environment:
    name: staging
    url: https://staging-api.orange-logistics.com
  only:
    - /^release\/.*$/
  tags:
    - k8s

# ==================== Deploy Production ====================
deploy-prod:
  stage: deploy-prod
  image: alpine/helm:3.14
  script:
    - |
      # 生产部署前备份当前版本号
      CURRENT_TAG=$(helm get values ${HELM_RELEASE} -n ${NAMESPACE} -o json 2>/dev/null | grep -o '"imageTag":"[^"]*"' | cut -d'"' -f4 || echo "none")
      echo "Current version: ${CURRENT_TAG}" > rollback-info.txt
      echo "New version: ${IMAGE_TAG}" >> rollback-info.txt

      helm upgrade --install ${HELM_RELEASE} ./deploy/helm/orange-logistics \
        --namespace ${NAMESPACE} \
        --set global.imageTag=${IMAGE_TAG} \
        --set global.imageRegistry=${HARBOR_REGISTRY} \
        -f ./deploy/helm/orange-logistics/values.yaml \
        -f ./deploy/k8s/overlays/prod/values-prod.yaml \
        --wait --timeout 15m
    - |
      kubectl set image deployment/ai-prediction \
        ai-prediction=${AI_PREDICTION_IMAGE}:${IMAGE_TAG} \
        -n ${NAMESPACE}
      kubectl set image deployment/ai-agent \
        ai-agent=${AI_AGENT_IMAGE}:${IMAGE_TAG} \
        -n ${NAMESPACE}
      kubectl rollout status deployment/ai-prediction -n ${NAMESPACE} --timeout=180s
      kubectl rollout status deployment/ai-agent -n ${NAMESPACE} --timeout=180s
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        curl -s -X POST "${WECHAT_WEBHOOK}" \
          -H 'Content-Type: application/json' \
          -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## 🚀 生产部署成功\n> 版本: ${IMAGE_TAG}\n> 提交: ${CI_COMMIT_MESSAGE}\n> 操作人: ${GITLAB_USER_NAME}\n> [查看详情](${CI_PIPELINE_URL})\"}}"
      else
        curl -s -X POST "${WECHAT_WEBHOOK}" \
          -H 'Content-Type: application/json' \
          -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## ❌ 生产部署失败!\n> 版本: ${IMAGE_TAG}\n> 请立即检查!\n> [查看日志](${CI_PIPELINE_URL})\"}}"
      fi
  artifacts:
    paths:
      - rollback-info.txt
    expire_in: 30 days
  environment:
    name: production
    url: https://api.orange-logistics.com
  when: manual
  only:
    - main
  tags:
    - k8s

# ==================== Rollback (Manual) ====================
rollback-prod:
  stage: deploy-prod
  image: alpine/helm:3.14
  script:
    - |
      echo "Rolling back to previous release..."
      helm rollback ${HELM_RELEASE} -n ${NAMESPACE}
      kubectl rollout status deployment --all -n ${NAMESPACE} --timeout=300s
  after_script:
    - |
      curl -s -X POST "${WECHAT_WEBHOOK}" \
        -H 'Content-Type: application/json' \
        -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## ⚠️ 生产已回滚\n> 操作人: ${GITLAB_USER_NAME}\n> 原因: 手动触发回滚\"}}"
  environment:
    name: production
  when: manual
  only:
    - main
  tags:
    - k8s
