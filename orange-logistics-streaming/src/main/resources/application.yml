  bootstrap-servers: kafka:9092
  topic: logistics-tracking-events
  group-id: spark-logistics-streaming

mysql:
  url: jdbc:mysql://mysql:3306/orange_logistics?useSSL=false&serverTimezone=Asia/Shanghai
