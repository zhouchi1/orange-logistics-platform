server:
  port: 8081

spring:
  config:
    import: "optional:nacos:${NACOS_ADDR:localhost:8848}"
  application:
    name: orange-logistics-monitor

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.orange.logistics.monitor: DEBUG

---
# Local dev mode - disable Nacos registration
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false