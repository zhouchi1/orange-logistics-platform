apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-namesrv
  namespace: orange-logistics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-namesrv
  template:
    metadata:
      labels:
        app: rocketmq-namesrv
    spec:
      containers:
        - name: rocketmq-namesrv
          image: apache/rocketmq:4.9.7
          command: ["sh", "mqnamesrv"]
          ports:
            - containerPort: 9876
          env:
            - name: JAVA_OPT_EXT
              value: "-Xms256m -Xmx256m"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-namesrv
  namespace: orange-logistics
spec:
  type: ClusterIP
  ports:
    - port: 9876
      targetPort: 9876
  selector:
    app: rocketmq-namesrv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-broker
  namespace: orange-logistics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-broker
  template:
    metadata:
      labels:
        app: rocketmq-broker
    spec:
      containers:
        - name: rocketmq-broker
          image: apache/rocketmq:4.9.7
          command: ["sh", "mqbroker", "-n", "rocketmq-namesrv.orange-logistics.svc.cluster.local:9876"]
          ports:
            - containerPort: 10911
            - containerPort: 10909
          env:
            - name: JAVA_OPT_EXT
              value: "-Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=256m"
            - name: NAMESRV_ADDR
              value: "rocketmq-namesrv.orange-logistics.svc.cluster.local:9876"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-broker
  namespace: orange-logistics
spec:
  type: ClusterIP
  ports:
    - name: main
      port: 10911
      targetPort: 10911
    - name: ha
      port: 10909
      targetPort: 10909
  selector:
    app: rocketmq-broker
