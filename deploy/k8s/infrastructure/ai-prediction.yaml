apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-prediction
  namespace: orange-logistics
  labels:
    app: ai-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-prediction
  template:
    metadata:
      labels:
        app: ai-prediction
    spec:
      enableServiceLinks: false
      containers:
        - name: ai-prediction
          image: orange-logistics-ai-prediction:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: PREDICTION_DB_HOST
              value: "mysql.orange-logistics.svc.cluster.local"
            - name: PREDICTION_DB_PORT
              value: "3306"
            - name: PREDICTION_DB_NAME
              value: "orange_logistics"
            - name: PREDICTION_DB_USER
              valueFrom:
                secretKeyRef:
                  name: orange-logistics-secrets
                  key: MYSQL_USERNAME
            - name: PREDICTION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orange-logistics-secrets
                  key: MYSQL_PASSWORD
            - name: REDIS_HOST
              value: "redis.orange-logistics.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-prediction
  namespace: orange-logistics
  labels:
    app: ai-prediction
spec:
  type: NodePort
  selector:
    app: ai-prediction
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30801
      protocol: TCP
