apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxl-job-admin
  namespace: orange-logistics
  labels:
    app: xxl-job-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xxl-job-admin
  template:
    metadata:
      labels:
        app: xxl-job-admin
    spec:
      containers:
        - name: xxl-job-admin
          image: xuxueli/xxl-job-admin:2.4.2
          ports:
            - containerPort: 8080
          env:
            - name: PARAMS
              value: >-
                --spring.datasource.url=jdbc:mysql://mysql.orange-logistics.svc.cluster.local:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
                --spring.datasource.username=root
                --spring.datasource.password=orange_logistics_2024
                --xxl.job.accessToken=orange-logistics-token-2024
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /xxl-job-admin/
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /xxl-job-admin/
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: xxl-job-admin
  namespace: orange-logistics
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30800
  selector:
    app: xxl-job-admin
