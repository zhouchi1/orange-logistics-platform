apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: orange-logistics
  labels:
    app: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      enableServiceLinks: false
      containers:
        - name: ai-agent
          image: orange-logistics-ai-agent:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          env:
            - name: MYSQL_HOST
              value: "mysql.orange-logistics.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: REDIS_HOST
              value: "redis.orange-logistics.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: AI_PREDICTION_URL
              value: "http://ai-prediction.orange-logistics.svc.cluster.local:8001"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 40
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  namespace: orange-logistics
  labels:
    app: ai-agent
spec:
  type: NodePort
  selector:
    app: ai-agent
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30802
      protocol: TCP
