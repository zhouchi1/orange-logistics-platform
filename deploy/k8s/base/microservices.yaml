---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logistics-gateway
  namespace: orange-logistics
  labels:
    app: logistics-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logistics-gateway
  template:
    metadata:
      labels:
        app: logistics-gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: logistics-gateway
          image: orange-logistics-platform-logistics-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: orange-logistics-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orange-logistics-secrets
                  key: MYSQL_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: logistics-gateway
  namespace: orange-logistics
spec:
  type: ClusterIP
  ports:
    - port: 8888
      targetPort: 8888
  selector:
    app: logistics-gateway
