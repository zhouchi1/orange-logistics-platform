# AI Services (deployed separately, not through Helm template loop)
aiServices:
  prediction:
    enabled: true
    name: ai-prediction
    image: orange-logistics-ai-prediction
    port: 8001
    replicas: 2
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    env:
      PREDICTION_DB_HOST: "mysql.orange-logistics.svc.cluster.local"
      PREDICTION_DB_PORT: "3306"
      PREDICTION_DB_NAME: "orange_logistics"
      REDIS_HOST: "redis.orange-logistics.svc.cluster.local"
      AI_PREDICTION_URL: "http://ai-prediction.orange-logistics.svc.cluster.local:8001"

  agent:
    enabled: true
    name: ai-agent
    image: orange-logistics-ai-agent
    port: 8002
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    env:
      MYSQL_HOST: "mysql.orange-logistics.svc.cluster.local"
      REDIS_HOST: "redis.orange-logistics.svc.cluster.local"
      AI_PREDICTION_URL: "http://ai-prediction.orange-logistics.svc.cluster.local:8001"

# XXL-JOB Admin
xxlJob:
  enabled: true
  image: xuxueli/xxl-job-admin:2.4.2
  port: 8080
  nodePort: 30800
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "768Mi"
      cpu: "500m"
  accessToken: "orange-logistics-token-2024"

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.orange-logistics.com
      paths:
        - path: /
          service: logistics-gateway
          port: 8888
    - host: admin.orange-logistics.com
      paths:
        - path: /xxl-job-admin
          service: xxl-job-admin
          port: 8080
  tls:
    - secretName: orange-logistics-tls
      hosts:
        - api.orange-logistics.com
        - admin.orange-logistics.com
