  im:
    enabled: true
    name: logistics-im
    image: orange-logistics-im
    port: 8093
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  auth:
    enabled: true
    name: logistics-auth
    image: orange-logistics-auth
    port: 8100
    replicas: 2
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "1000m"

  order:
    enabled: true
    name: logistics-order
    image: orange-logistics-order
    port: 8101
    replicas: 2
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "1000m"

  waybill:
    enabled: true
    name: logistics-waybill
    image: orange-logistics-waybill
    port: 8102
    replicas: 2
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "1000m"

  warehouse:
    enabled: true
    name: logistics-warehouse
    image: orange-logistics-warehouse
    port: 8103
    replicas: 2
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
